<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      background: #073262;
      background-image:
        radial-gradient(ellipse 900px 500px at 60% 40%, #0f4a8c 0%, transparent 70%),
        linear-gradient(160deg, #051f3d 0%, #073262 45%, #082d55 100%);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      position: relative;
    }

    /* Subtle grid texture */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .logo-wrap {
      width: 760px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap svg {
      width: 100%;
      height: auto;
      fill: #ffffff;
    }

    .rule {
      width: 760px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(74,144,217,0.6) 20%, rgba(74,144,217,0.6) 80%, transparent);
      margin-top: 32px;
    }

    .tagline {
      font-family: "Poppins", "Inter", sans-serif;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.88);
      margin-top: 24px;
      text-align: center;
    }

    .chips {
      display: flex;
      gap: 10px;
      margin-top: 32px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 100px;
      padding: 7px 20px;
      font-family: "Inter", sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .domain {
      position: absolute;
      bottom: 34px;
      right: 44px;
      font-family: "Inter", sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.04em;
    }

    .accent-dot {
      position: absolute;
      bottom: 34px;
      left: 44px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a90d9;
      opacity: 0.7;
    }
  </style>
</head>
